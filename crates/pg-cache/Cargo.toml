[package]
name = "pg-cache"
version = "0.1.0"
edition = "2021"

[lib]
name = "pg_cache"
crate-type = ["cdylib", "lib"]

[features]
default = ["pg17"]
pg17 = ["pgrx/pg17"]
pg_test = []
journal-prototype = []
io-diagnostics = ["pg-cache-core/io-diagnostics"]

[dependencies]
pg-cache-core = { path = "../cache-core" }
pgrx = "=0.16.1"
libc = "0.2"
