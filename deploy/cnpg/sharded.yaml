---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: flaro-private-redis
spec:
  podSelector:
    matchExpressions:
      - key: cnpg.io/cluster
        operator: In
        values: [flaro-a, flaro-b, flaro-c]
  policyTypes: [Ingress]
  ingress:
    - ports:
        - {protocol: TCP, port: 5432}
        - {protocol: TCP, port: 8000}
        - {protocol: TCP, port: 9187}
    - from:
        - podSelector:
            matchLabels:
              pg-cache-client: 'true'
        - podSelector:
            matchExpressions:
              - key: cnpg.io/cluster
                operator: In
                values: [flaro-a, flaro-b, flaro-c]
      ports:
        - {protocol: TCP, port: 6380}
